name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & offline tests (Crystal ${{ matrix.crystal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the supported minimum; latest stable exercises the most
        # recent compiler.
        crystal: ['1.10.0', '1.15.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Crystal ${{ matrix.crystal }}
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Print Crystal version
        run: crystal --version

      - name: Validate shard manifest
        run: shards check

      - name: Build library (compile main module)
        # Compile the main module directly to exercise the whole public
        # surface without producing an executable.
        run: crystal build --no-codegen --error-trace src/mongreldb.cr

      # The offline unit tests (exception hierarchy, query-builder alias
      # translation, cells flattening, CRLF-escaping checks, base-URL
      # normalization) run without a daemon. Live tests self-skip when no
      # server binary is found.
      - name: Run tests
        run: crystal spec --error-trace

  live:
    # Boots a real mongreldb-server and runs the live round-trip suite.
    name: Live integration (against mongreldb-server)
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: '0.52.3'
      # The test harness boots the daemon itself from ./bin/mongreldb-server.
      # MONGRELDB_SERVER points it at the downloaded binary.
      MONGRELDB_SERVER: ./bin/mongreldb-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: '1.15.0'

      - name: Cache mongreldb-server binary
        id: server-cache
        uses: actions/cache@v6
        with:
          path: bin/mongreldb-server
          key: mongreldb-server-linux-x64-${{ env.SERVER_VERSION }}

      - name: Download mongreldb-server
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSL -o bin/mongreldb-server \
            "https://github.com/visorcraft/MongrelDB/releases/download/v${SERVER_VERSION}/mongreldb-server-linux-x64"
          chmod +x bin/mongreldb-server
          ./bin/mongreldb-server --help | head -n 1

      - name: Run live tests
        continue-on-error: true
        run: crystal spec --error-trace

      - name: Start mongreldb-server for examples
        run: |
          rm -rf /tmp/mongreldb-data-ex
          ./bin/mongreldb-server /tmp/mongreldb-data-ex --port 8453 > /tmp/mongreldb-server-ex.log 2>&1 &
          echo $! > /tmp/mongreldb-server-ex.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8453/health >/dev/null 2>&1; then
              echo "mongreldb-server is healthy for examples"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8453/health >/dev/null || (cat /tmp/mongreldb-server-ex.log && exit 1)

      - name: Run examples
        continue-on-error: true
        run: |
          for ex in examples/*.cr; do
            echo "=== Running $ex ==="
            crystal run --error-trace "$ex" || { echo "FAILED: $ex"; exit 1; }
          done

      - name: Stop mongreldb-server for examples
        if: always()
        run: |
          if [ -f /tmp/mongreldb-server-ex.pid ]; then
            kill "$(cat /tmp/mongreldb-server-ex.pid)" 2>/dev/null || true
          fi

      - name: Dump server log on failure
        if: failure()
        run: |
          log="$(ls -t /tmp/mongreldb-crystal-server-*.log 2>/dev/null | head -n 1)"
          if [ -n "$log" ]; then cat "$log"; fi
